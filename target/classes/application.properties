server.port=8080
spring.application.name=retail-order-system

# Embedded H2 Database (File based persistence in ./data/retaildb)
spring.datasource.url=jdbc:h2:file:./data/retaildb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Web Console for quick inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static files
spring.web.resources.static-locations=classpath:/static/
